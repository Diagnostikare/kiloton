steps:
  - name: 'node:22.20.0-alpine3.22'
    id: 'validate'
    entrypoint: 'sh'
    args:
      - '-ceu'
      - |
        corepack enable
        pnpm install --frozen-lockfile
        pnpm lint

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    waitFor: ['validate']
    args:
      - 'build'
      - '--tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    waitFor: ['build']
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'deploy-candidate'
    waitFor: ['push']
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--service-account=${_RUNTIME_SERVICE_ACCOUNT}'
      - '--no-traffic'
      - '--tag=candidate-$SHORT_SHA'
      - '--port=8080'
      - '--cpu=1'
      - '--memory=512Mi'
      - '--concurrency=80'
      - '--timeout=300s'
      - '--min-instances=0'
      - '--max-instances=4'
      - '--startup-probe=httpGet.path=/api/health,initialDelaySeconds=0,timeoutSeconds=3,periodSeconds=5,failureThreshold=12'
      - '--liveness-probe=httpGet.path=/api/health,initialDelaySeconds=10,timeoutSeconds=3,periodSeconds=30,failureThreshold=3'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'resolve-candidate-url'
    waitFor: ['deploy-candidate']
    entrypoint: 'sh'
    args:
      - '-ceu'
      - |
        CANDIDATE_URL="$$(gcloud run services describe "${_SERVICE_NAME}" \
          --region="${_REGION}" \
          --platform=managed \
          --format="value(status.traffic[?tag='candidate-$SHORT_SHA'].url)")"
        test -n "$${CANDIDATE_URL}"
        printf '%s' "$${CANDIDATE_URL}" > /workspace/candidate-url

  - name: 'node:22.20.0-alpine3.22'
    id: 'smoke-candidate'
    waitFor: ['resolve-candidate-url']
    entrypoint: 'sh'
    args:
      - '-ceu'
      - |
        CANDIDATE_URL="$$(cat /workspace/candidate-url)"
        BASE_URL="$${CANDIDATE_URL}" node scripts/smoke-test.mjs

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'promote'
    waitFor: ['smoke-candidate']
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - '${_SERVICE_NAME}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--to-tags=candidate-$SHORT_SHA=100'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA'

substitutions:
  _REGION: 'us-central1'
  _REPOSITORY: 'cloud-run-source-deploy'
  _SERVICE_NAME: 'kiloton'
  _RUNTIME_SERVICE_ACCOUNT: 'kiloton-runtime@$PROJECT_ID.iam.gserviceaccount.com'

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'
